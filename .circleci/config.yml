    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Thaw the standard curve in dry run mode
          command: |
            mkdir -p /tmp/run5
            set +o pipefail 2>/dev/null; seq 1 1289198 | gzip -1 > /tmp/run5/9zflduab; true
            echo "Stage 'whiskey' has produced its output successfully"
      - persist_to_workspace:
          root: /tmp/run5
          paths:
            - '9zflduab'
  whiskey:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run5
      - run:
          name: Verify step-4
          command: |
            # log-style peek
            echo "[$(date -Iseconds)] upstream=/tmp/run5/9zflduab size=$(wc -c < /tmp/run5/9zflduab 2>/dev/null || echo ?)" || true
      - run:
          name: Fetch repo
          command: git clone --depth 1 -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll archive
          command: zcat pit-spare.tgz | tar xvf -
      - run:
          command: env | wc -l
      - run:
          name: Store metadata
          command: df -h
